<div class="library-view">
  <header class="library-controls" aria-label="Library controls">
    <div class="library-search">
      <label class="sr-only" for="library-search">Search</label>
      <div class="library-search-input">
        <input id="library-search" type="search" data-role="search" placeholder="Search titles, authors, venues, topics…" autocomplete="off" spellcheck="false" />
        <button type="button" data-role="search-clear" class="library-search-clear" aria-label="Clear search" hidden>✕</button>
        <span class="library-search-spinner" data-role="search-spinner" hidden></span>
      </div>
    </div>
    <div class="library-mode" role="tablist" aria-label="Library mode">
      <button type="button" class="is-active" data-role="mode-btn" data-mode="publications" aria-selected="true">Publications</button>
      <button type="button" data-role="mode-btn" data-mode="authors" aria-selected="false">Authors</button>
    </div>
    <div class="library-actions"></div>
  </header>

  <div class="library-filter-bar" data-role="filter-bar" aria-label="Active filters"></div>

  <section class="library-results" id="library-results" aria-live="polite"></section>
  <div class="library-author-overlay" data-role="author-overlay" aria-hidden="true">
    <div class="library-overlay-backdrop" data-role="overlay-dismiss"></div>
    <aside class="library-overlay-panel" role="dialog" aria-modal="true" aria-labelledby="library-overlay-title">
      <button type="button" class="library-overlay-close" data-role="overlay-dismiss" aria-label="Close author details">✕</button>
      <div class="library-overlay-content" data-role="overlay-content"></div>
    </aside>
  </div>
</div>
