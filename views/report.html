<link rel="stylesheet" href="./css/report.css">

<div class="report-view">
  <header class="report-controls" aria-label="Report controls">
    <div class="report-select">
      <label for="report-select" class="sr-only">Choose report</label>
      <select id="report-select" data-role="report-select"></select>
    </div>
    <button type="button" data-role="report-show" class="report-show">Show</button>
  </header>

  <section class="report-body">
    <div class="report-chart-card">
      <div class="report-chart-header">
        <h2 data-role="report-title">Report</h2>
        <div class="report-chart-meta" data-role="report-meta"></div>
        <div class="report-chart-options" data-role="report-options"></div>
      </div>
      <div class="report-chart" data-role="report-chart"></div>
      <div class="report-legend" data-role="report-legend"></div>
    </div>

    <div class="report-table" data-role="report-table"></div>
  </section>
</div>
