<link rel="stylesheet" href="css/network_graph.css">

<div class="network-graph-view">
  <div id="network-chart" class="network-chart"></div>

  <div id="network-panel" class="network-panel">
    <div class="network-panel-info">
      <strong>Click a node</strong> to focus. Click background to reset.
      <div class="network-small" id="network-status">Loading graph...</div>
      <div class="network-small network-muted" id="network-filter-summary"></div>
    </div>

    <div class="network-panel-controls">
      <div class="network-control-group">
        <label class="network-label">Institutional authors</label>
        <select id="network-inst-select">
          <option value="any">any authorship</option>
          <option value="main">main authorship</option>
        </select>
        <div class="network-muted">applies to local authors (source)</div>
      </div>

      <div class="network-control-group">
        <label class="network-label">Collaborating authors</label>
        <select id="network-collab-select">
          <option value="any">any authorship</option>
          <option value="main">main authorship</option>
        </select>
        <div class="network-muted">applies to collaborators (target)</div>
      </div>

      <div class="network-control-group">
        <label class="network-label">From</label>
        <div id="network-from-fixed" class="network-muted">—</div>
        <div class="network-muted">fixed (from JSON config)</div>
      </div>

      <div class="network-control-group">
        <label class="network-label">To (live preview)</label>
        <div class="network-range-inline">
          <input id="network-year-to-range" type="range" min="2000" max="2025" step="1" value="2025" />
          <span id="network-year-to-value">2025</span>
        </div>
      </div>

      <div class="network-control-group">
        <label class="network-label">Edge threshold</label>
        <input id="network-edge-slider" type="range" min="1" max="10" step="1" value="1" />
        <span id="network-edge-value">1</span>
      </div>

      <div class="network-control-group">
        <input id="network-search" placeholder="Search author..." />
      </div>

      <div class="network-control-group network-control-buttons">
        <button id="network-apply" class="network-btn">Apply filters</button>
        <button id="network-reset" class="network-btn">Reset layout</button>
        <button id="network-dump" class="network-btn" title="Debug dump">Debug dump</button>
      </div>
    </div>
  </div>

  <div id="network-tooltip" class="network-tooltip" style="display:none"></div>
</div>
