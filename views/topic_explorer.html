<link rel="stylesheet" href="./css/topic_explorer.css">

<div id="topic-explorer-container" class="topic-explorer-view">
  <div class="app">
    <div class="stage" aria-label="Zoomable topic map">
      <div class="stage-inner">
        <div class="breadcrumbs" id="breadcrumbs" aria-live="polite"></div>

        <!-- main svg -->
        <svg id="viz" role="img" tabindex="0" aria-describedby="viz-desc" viewBox="-466 -466 932 932"></svg>

        <p id="viz-desc" hidden>Circle packing of topics. Click a circle to zoom in; click the background to zoom out. Details appear in the right panel.</p>

        <!-- tooltip -->
        <div class="tooltip" id="tooltip"></div>

        <div class="since-slider" id="since-slider" aria-label="Filter topics by publication year">
          <div class="slider-head">
            <span class="since-label" id="since-year-label">Since —</span>
            <button class="layout-toggle" id="layout-mode-toggle" type="button" title="Stable layout: shrink bubbles in place">
              <span class="icon" aria-hidden="true">📌</span>
              <span class="text">Stable</span>
            </button>
          </div>
          <div class="slider-row">
            <span class="year-mark" id="since-year-start">—</span>
            <input type="range" id="since-year-range" min="0" max="0" step="1" value="0" aria-label="Set minimum publication year">
            <span class="year-mark" id="since-year-end">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- right panel -->
    <aside class="panel" id="panel" aria-label="Topic details">
      <div id="panel-content">
        <p class="meta">Select a topic bubble to see top publications, authors, journals, and keywords.</p>
        <div class="skeleton" style="height:140px"></div>
      </div>
    </aside>
  </div>
</div>
